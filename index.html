<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevOps Systems Architecture | Learning Portal</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --sidebar-bg: #1e293b;
            --text-main: #333;
            --text-light: #f8fafc;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --ai-bg: #f0f9ff;
            --border: #e2e8f0;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
        }
        /* Sidebar Styles */
        #sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            padding: 20px 0;
            overflow-y: auto;
            flex-shrink: 0;
        }
        #sidebar h2 {
            padding: 0 20px;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #94a3b8;
        }
        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 4px solid transparent;
        }
        .nav-item:hover, .nav-item.active {
            background-color: #334155;
            border-left: 4px solid var(--accent);
        }
        /* Main Content Styles */
        #main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
        }
        .content-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { margin-top: 0; color: #0f172a; }
        h3 { color: var(--accent); margin-top: 25px; }
        p, li { line-height: 1.6; }
        
        /* AI Integration Styles */
        .ai-toolbar {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        .ai-expansion {
            background-color: var(--ai-bg);
            border-left: 4px solid var(--accent);
            padding: 15px 20px;
            margin-top: 15px;
            border-radius: 0 4px 4px 0;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Learning Modules</h2>
        <div id="nav-links"></div>
    </div>

    <div id="main-content">
        <div class="content-card" id="content-display">
            <!-- Content injects here via JavaScript -->
        </div>
    </div>

    <script>
        // 1. Database: Your specific curriculum data
        const curriculumData = {
            "glossary": {
                title: "Part 1: Glossary & Technical Terms",
                content: `
                    <h3>Apex</h3>
                    <p>Salesforce's proprietary object-oriented programming language. Runs on Salesforce servers. Used to write custom business logic inside Salesforce that cannot be done through point-and-click configuration (e.g., automated quote recalculation triggers).</p>
                    
                    <h3>LWC — Lightning Web Components</h3>
                    <p>Salesforce's modern front-end development framework. Built using standard HTML, CSS, and JavaScript. Used for creating custom user interfaces, like real-time interactive quoting panels.</p>
                    
                    <h3>Boomi / iPaaS</h3>
                    <p>Integration Platform as a Service. An enterprise-grade middleware used to build and manage data pipelines between different software systems (e.g., Salesforce CPQ to Zuora). Similar conceptually to n8n, but designed for massive scale.</p>
                `
            },
            "engineering": {
                title: "Gap 1: Engineering Team Leadership",
                content: `
                    <h3>Why it matters</h3>
                    <p>This role requires you to run daily standups, plan sprints, assign work to developers, conduct 1:1s, and be accountable for team delivery in an Agile environment.</p>
                    <h3>Action Plan</h3>
                    <ul>
                        <li><strong>Weeks 1-2:</strong> Agile & Scrum Foundations (Scrum.org PSM I path)</li>
                        <li><strong>Weeks 3-4:</strong> Read "The Manager's Path" by Camille Fournier</li>
                        <li><strong>Week 5:</strong> Jira Administration Basics</li>
                    </ul>
                `
            },
            "apex-lwc": {
                title: "Gap 2: Apex & LWC Development",
                content: `
                    <h3>Why it matters</h3>
                    <p>You will be directing developers who write Apex and LWC daily. You need to understand what is possible, what is complex, and how to review technical designs intelligently.</p>
                    <h3>Action Plan</h3>
                    <ul>
                        <li><strong>Weeks 1-2:</strong> Salesforce Platform Basics & Data Modeling (Trailhead)</li>
                        <li><strong>Weeks 3-5:</strong> Apex Basics & Database, Apex Triggers</li>
                        <li><strong>Weeks 6-7:</strong> Build Apps with LWC (HTML/JS/CSS foundations)</li>
                    </ul>
                `
            }
            // Additional modules (Zuora, CI/CD, Agentforce) can be easily added here
        };

        // 2. State Management
        let currentModule = "glossary";

        // 3. Render Navigation
        const navContainer = document.getElementById("nav-links");
        Object.keys(curriculumData).forEach(key => {
            const div = document.createElement("div");
            div.className = "nav-item";
            div.innerText = curriculumData[key].title;
            div.onclick = () => loadModule(key, div);
            navContainer.appendChild(div);
        });

        // 4. Render Content
        function loadModule(key, clickedElement) {
            currentModule = key;
            const data = curriculumData[key];
            
            // Update Active State in Sidebar
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(clickedElement) clickedElement.classList.add('active');

            // Build the HTML for the main viewing area
            const contentHTML = `
                <h1>${data.title}</h1>
                <div id="module-text">${data.content}</div>
                
                <div class="ai-toolbar">
                    <input type="text" id="ai-query" placeholder="Ask AI to elaborate on a concept in this module...">
                    <button onclick="askAI()">Dive Deeper</button>
                </div>
                <div id="ai-responses"></div>
            `;
            document.getElementById("content-display").innerHTML = contentHTML;
        }

        // 5. The "Invoke AI" Function
        // In a real production app, this would use the fetch() API to call Gemini.
        // Here, we simulate the network request and DOM injection.
        function askAI() {
            const query = document.getElementById("ai-query").value;
            if (!query) return;

            const responseContainer = document.getElementById("ai-responses");
            
            // Show loading state
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "ai-expansion";
            loadingDiv.innerHTML = "<em>Analyzing your request and generating architecture...</em>";
            responseContainer.prepend(loadingDiv);

            // Simulate API latency (1.5 seconds)
            setTimeout(() => {
                loadingDiv.innerHTML = `
                    <strong>AI Expansion: ${query}</strong><br><br>
                    Here is the elaborated information regarding your query. In a fully connected version, this text is returned directly from the Gemini API using your API key. <br><br>
                    Because this is an HTML/JS frontend, you can easily integrate the real API by replacing this setTimeout block with: <br>
                    <code>fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent', { ... })</code>
                `;
                document.getElementById("ai-query").value = ''; // Clear input
            }, 1500);
        }

        // Initialize first load
        loadModule("glossary", navContainer.firstChild);
        navContainer.firstChild.classList.add('active');

    </script>
</body>
</html>
